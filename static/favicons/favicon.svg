<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <!-- Outer glow -->
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur1"/>
      <feFlood flood-color="#00ffaa" flood-opacity="0.25" result="color1"/>
      <feComposite in="color1" in2="blur1" operator="in" result="glow1"/>
      <!-- Mid glow -->
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur2"/>
      <feFlood flood-color="#00ffaa" flood-opacity="0.4" result="color2"/>
      <feComposite in="color2" in2="blur2" operator="in" result="glow2"/>
      <!-- Inner bright core -->
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.5" result="blur3"/>
      <feFlood flood-color="#aaffdd" flood-opacity="0.6" result="color3"/>
      <feComposite in="color3" in2="blur3" operator="in" result="glow3"/>
      <!-- Stack all layers -->
      <feMerge>
        <feMergeNode in="glow1"/>
        <feMergeNode in="glow2"/>
        <feMergeNode in="glow3"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Subtle reflection on surface -->
    <radialGradient id="surfaceGlow" cx="50%" cy="85%" r="40%">
      <stop offset="0%" stop-color="#00ffaa" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00ffaa" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="22" fill="#080818"/>
  <!-- Surface reflection -->
  <rect width="128" height="128" rx="22" fill="url(#surfaceGlow)"/>
  <!-- Neon text -->
  <text x="64" y="78" text-anchor="middle" font-family="'Courier New', monospace" font-weight="bold" font-size="40" fill="#00ffaa" filter="url(#neon)">&lt;N/&gt;</text>
</svg>
