name: Update Dynamic Content

on:
    schedule:
        # 1st of every month at 09:00 UTC
        - cron: '0 9 1 * *'
    workflow_dispatch: # Allow manual trigger

permissions:
    contents: write

jobs:
    update:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Fetch GitHub repos
              env:
                  VITE_GITHUB_TOKEN: ${{ secrets.VITE_GITHUB_TOKEN }}
              run: npm run fetch-repos

            - name: Fetch Medium articles
              run: npm run fetch-articles

            - name: Sync profile files
              run: npm run sync-profile

            - name: Prerender profile
              run: npm run prerender-profile

            - name: Build
              env:
                  VITE_GITHUB_TOKEN: ${{ secrets.VITE_GITHUB_TOKEN }}
              run: npm run build

            - name: Check for changes
              id: changes
              run: |
                  git diff --quiet resume.json static/ docs/ || echo "changed=true" >> "$GITHUB_OUTPUT"

            - name: Commit and push
              if: steps.changes.outputs.changed == 'true'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add resume.json static/ docs/
                  git commit -m "chore: update dynamic content (GitHub repos + Medium articles)

                  Automated monthly update via GitHub Actions."
                  git push
