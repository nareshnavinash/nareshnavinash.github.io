<body>
  <!-- Main 3D Canvas -->
  <canvas id="game-canvas"></canvas>

      <div id="hud-area-name"></div>

      <button id="content-panel-close" aria-label="Close panel">&times;</button>

    </div>

    <div id="interact-prompt" class="hidden">
      <span class="interact-key">E</span> to interact
    </div>
  </div>

  <noscript>
